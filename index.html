<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍎 童谣四合一 · 读读童谣和儿歌（四）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
      background: #f9f0e1;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .app-wrapper {
      max-width: 1100px;
      width: 100%;
      background: #fff9ef;
      border-radius: 60px 60px 40px 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      padding: 20px 22px 30px;
      border: 3px solid #f7e4cc;
    }
    h1 {
      font-size: 2.4rem;
      color: #a65336;
      text-shadow: 4px 4px 0 #fbd5a2;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    h1 small {
      font-size: 1.0rem;
      background: #d9b382;
      color: #2d1f13;
      padding: 0 20px;
      border-radius: 60px;
      font-weight: 400;
      box-shadow: inset 0 -2px 0 #b28b64;
    }
    .tab-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 14px 0 16px;
    }
    .tab-btn {
      background: #e7d5be;
      border: none;
      padding: 10px 20px;
      border-radius: 60px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #3e2a18;
      box-shadow: 0 4px 0 #b28b64;
      cursor: pointer;
      transition: 0.07s linear;
      border: 2px solid #fef3e0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .tab-btn.active {
      background: #ffd79c;
      transform: translateY(2px);
      box-shadow: 0 2px 0 #b28b64;
    }
    .tab-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b28b64; }
    .game-panel {
      background: #fffcf2;
      border-radius: 48px;
      padding: 18px 16px 24px;
      box-shadow: inset 0 -6px 0 #d9b382, 0 12px 24px rgba(100,70,40,0.1);
      border: 2px solid #f7e5cc;
      min-height: 420px;
    }
    .hidden { display: none !important; }

    /* ----- 通用按钮 ----- */
    .btn-main {
      background: #ffb882;
      border: none;
      padding: 14px 32px;
      border-radius: 60px;
      font-size: 1.4rem;
      font-weight: 700;
      color: #2d1f13;
      box-shadow: 0 6px 0 #b28b64;
      cursor: pointer;
      transition: 0.07s linear;
      border: 2px solid #f7e5cc;
      margin: 6px 0;
    }
    .btn-main:active { transform: translateY(4px); box-shadow: 0 2px 0 #b28b64; }
    .btn-main:disabled { opacity: 0.5; transform: translateY(4px); box-shadow: 0 2px 0 #b28b64; pointer-events: none; }
    .btn-small { padding: 8px 20px; font-size: 1.0rem; }

    /* ----- 游戏1: 小星星 ----- */
    .star-area { text-align: center; }
    .star-q-box {
      background: #f6efe4;
      border-radius: 40px;
      padding: 16px 20px;
      margin: 10px 0;
      border: 2px solid #e6d3bc;
    }
    .star-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }
    .star-options .opt {
      background: #fcf6ed;
      padding: 10px 18px;
      border-radius: 60px;
      border: 2px solid #dcc9b2;
      cursor: pointer;
      font-weight: 500;
      transition: 0.1s;
      box-shadow: 0 3px 0 #c6ad8e;
    }
    .star-options .opt:hover { background: #efe1cf; }
    .star-options .opt.correct { background: #b7d7b0; border-color: #3f7840; box-shadow: 0 3px 0 #2a5a2b; }
    .star-options .opt.wrong { background: #f4bcbc; border-color: #b34a4a; box-shadow: 0 3px 0 #7f3333; }
    .star-options .opt.disabled { pointer-events: none; opacity: 0.6; }
    .star-score {
      font-size: 2.0rem;
      font-weight: 700;
      background: #efe3d2;
      padding: 8px 24px;
      border-radius: 60px;
      display: inline-block;
      margin: 6px 0;
    }

    /* ----- 游戏2: 摘苹果 (三棵树) ----- */
    .apple-area { text-align: center; }
    .apple-trees {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 12px 0;
    }
    .tree {
      background: #e7f0da;
      border-radius: 60px 60px 30px 30px;
      padding: 12px 16px 18px;
      min-width: 140px;
      flex: 1 1 120px;
      border: 3px solid #b5c99a;
      box-shadow: inset 0 -6px 0 #8aa07a;
    }
    .tree h3 {
      background: #8aa07a;
      color: white;
      border-radius: 40px;
      padding: 4px 0;
      font-size: 1.1rem;
    }
    .tree-apples {
      font-size: 2.8rem;
      min-height: 70px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 2px;
      padding: 6px 0;
    }
    .tree .tree-score {
      background: #fff9ed;
      border-radius: 40px;
      padding: 4px 12px;
      font-weight: 700;
      display: inline-block;
    }
    .apple-q-box {
      background: #f6efe4;
      border-radius: 40px;
      padding: 14px 18px;
      margin: 10px 0;
      border: 2px solid #e6d3bc;
    }
    .apple-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }
    .apple-options .opt {
      background: #fcf6ed;
      padding: 8px 16px;
      border-radius: 60px;
      border: 2px solid #dcc9b2;
      cursor: pointer;
      font-weight: 500;
      box-shadow: 0 3px 0 #c6ad8e;
      transition: 0.05s;
    }
    .apple-options .opt:active { transform: scale(0.97); }
    .apple-options .opt.correct { background: #b7d7b0; border-color: #3f7840; box-shadow: 0 3px 0 #2a5a2b; }
    .apple-options .opt.wrong { background: #f4bcbc; border-color: #b34a4a; box-shadow: 0 3px 0 #7f3333; }
    .apple-options .opt.disabled { pointer-events: none; opacity: 0.6; }

    /* ----- 游戏3: 动物过河 ----- */
    .frog-area { text-align: center; }
    .frog-scene {
      background: #d4e9d6;
      border-radius: 60px;
      padding: 16px 10px;
      margin: 10px 0;
      border: 3px solid #8ab88a;
      position: relative;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .frog-pos {
      font-size: 3.8rem;
      transition: 0.3s;
      flex: 1;
      text-align: center;
      min-width: 80px;
    }
    .frog-river {
      font-size: 2.2rem;
      flex: 2;
      text-align: center;
      min-width: 120px;
      letter-spacing: 8px;
    }
    .frog-status {
      font-size: 1.2rem;
      font-weight: 600;
      background: #fff9ed;
      padding: 6px 20px;
      border-radius: 60px;
      display: inline-block;
      margin: 6px 0;
    }
    .frog-q-box {
      background: #f6efe4;
      border-radius: 40px;
      padding: 14px 18px;
      margin: 10px 0;
      border: 2px solid #e6d3bc;
    }
    .frog-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }
    .frog-options .opt {
      background: #fcf6ed;
      padding: 8px 16px;
      border-radius: 60px;
      border: 2px solid #dcc9b2;
      cursor: pointer;
      font-weight: 500;
      box-shadow: 0 3px 0 #c6ad8e;
    }
    .frog-options .opt.correct { background: #b7d7b0; border-color: #3f7840; box-shadow: 0 3px 0 #2a5a2b; }
    .frog-options .opt.wrong { background: #f4bcbc; border-color: #b34a4a; box-shadow: 0 3px 0 #7f3333; }
    .frog-options .opt.disabled { pointer-events: none; opacity: 0.6; }

    /* ----- 游戏4: 配对卡 (完整题目+答案) ----- */
    .match-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
    }
    .match-col {
      flex: 1 1 280px;
      min-width: 200px;
      background: #f6efe4;
      border-radius: 40px;
      padding: 10px 8px;
      border: 2px solid #e6d3bc;
      max-height: 460px;
      overflow-y: auto;
    }
    .match-col h3 {
      text-align: center;
      background: #dcc9b2;
      border-radius: 60px;
      padding: 4px 0;
      font-size: 0.95rem;
      color: #2d1f13;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .match-item {
      background: #fffcf2;
      margin: 5px 0;
      padding: 6px 12px;
      border-radius: 60px;
      border: 2px solid #d5bea2;
      cursor: pointer;
      font-weight: 500;
      transition: 0.1s;
      text-align: center;
      box-shadow: 0 2px 0 #b28b64;
      font-size: 0.85rem;
      word-break: break-word;
    }
    .match-item.selected { background: #ffe3b5; border-color: #b28b64; }
    .match-item.matched { background: #b7d7b0; border-color: #3f7840; opacity: 0.5; pointer-events: none; text-decoration: line-through; }
    .match-item.wrong-pick { background: #f4bcbc; border-color: #b34a4a; }
    .match-info { display: flex; justify-content: space-between; margin-top: 12px; flex-wrap: wrap; gap: 8px; align-items: center; }

    @media (max-width: 600px) {
      h1 { font-size: 1.8rem; }
      .tab-btn { padding: 6px 14px; font-size: 0.9rem; }
      .match-col { flex: 1 1 160px; min-width: 130px; max-height: 320px; }
      .match-item { font-size: 0.75rem; }
      .frog-pos { font-size: 2.8rem; }
    }
  </style>
</head>
<body>
<div class="app-wrapper">
  <h1>
    📚 童谣四合一
    <small>读读童谣和儿歌·四</small>
  </h1>
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="star">⭐ 小星星</button>
    <button class="tab-btn" data-tab="apple">🍎 摘苹果</button>
    <button class="tab-btn" data-tab="frog">🐸 过河</button>
    <button class="tab-btn" data-tab="match">🧩 配对卡</button>
  </div>

  <div class="game-panel" id="panelContainer">
    <!-- 游戏1: 小星星 -->
    <div id="starPanel" class="star-area">
      <div class="star-score">⭐ <span id="starScore">0</span> / 27</div>
      <div class="star-q-box">
        <div id="starQTitle" style="font-weight:600;">《太阳公公起得早》</div>
        <div id="starQText">儿歌中的娃娃在（  ）</div>
        <div class="star-options" id="starOptions"></div>
      </div>
      <button class="btn-main btn-small" id="starResetBtn">🔄 重新开始</button>
    </div>

    <!-- 游戏2: 摘苹果 -->
    <div id="applePanel" class="hidden apple-area">
      <div class="apple-trees" id="appleTrees">
        <div class="tree" data-group="0"><h3>🌳 第一组</h3><div class="tree-apples" id="tree0"></div><span class="tree-score">🍎 <span id="treeScore0">0</span></span></div>
        <div class="tree" data-group="1"><h3>🌳 第二组</h3><div class="tree-apples" id="tree1"></div><span class="tree-score">🍎 <span id="treeScore1">0</span></span></div>
        <div class="tree" data-group="2"><h3>🌳 第三组</h3><div class="tree-apples" id="tree2"></div><span class="tree-score">🍎 <span id="treeScore2">0</span></span></div>
      </div>
      <div class="apple-q-box">
        <div id="appleQTitle" style="font-weight:600;">《太阳公公起得早》</div>
        <div id="appleQText">儿歌中的娃娃在（  ）</div>
        <div class="apple-options" id="appleOptions"></div>
      </div>
      <div style="margin-top:8px; font-weight:500;" id="appleStatus">点击选项为当前组摘苹果！</div>
      <button class="btn-main btn-small" id="appleResetBtn">🔄 重新开始</button>
    </div>

    <!-- 游戏3: 动物过河 -->
    <div id="frogPanel" class="hidden frog-area">
      <div class="frog-scene">
        <div class="frog-pos" id="frogIcon">🐸</div>
        <div class="frog-river" id="riverDisplay">🌊🌊🌊🌊🌊🌊🌊🌊🌊</div>
      </div>
      <div class="frog-status" id="frogStatus">🐸 出发！答对向前跳</div>
      <div class="frog-q-box">
        <div id="frogQTitle" style="font-weight:600;">《太阳公公起得早》</div>
        <div id="frogQText">儿歌中的娃娃在（  ）</div>
        <div class="frog-options" id="frogOptions"></div>
      </div>
      <button class="btn-main btn-small" id="frogResetBtn">🔄 重新开始</button>
    </div>

    <!-- 游戏4: 配对卡 -->
    <div id="matchPanel" class="hidden">
      <div class="match-grid">
        <div class="match-col" id="matchLeftCol"><h3>📖 题目</h3></div>
        <div class="match-col" id="matchRightCol"><h3>✅ 正确答案</h3></div>
      </div>
      <div class="match-info">
        <span>✅ 已配对：<span id="matchCount">0</span> / 27</span>
        <span id="matchMsg">💡 点击左侧题目，再点右侧答案</span>
        <button class="btn-main btn-small" id="matchResetBtn">🔄 重新配对</button>
      </div>
    </div>
  </div>
</div>

<script>
  // ---------- 第四册 27道题 ----------
  const QUESTIONS = [
    { title: "《太阳公公起得早》", text: "儿歌中的娃娃在（  ）", options: ["① 睡懒觉", "② 在院子里玩耍", "③ 做早操"], correct: 2 },
    { title: "《十个好朋友》", text: "儿歌中的'十个好朋友'是指（  ）", options: ["① 十个小朋友", "② 十个手指头"], correct: 1 },
    { title: "《我们爱树苗》", text: "下面哪一项不是爱护树苗的行为？（  ）", options: ["① 勤浇水", "② 勤施肥", "③ 乱踩踩"], correct: 2 },
    { title: "《懒汉懒》", text: "懒汉最后（  ）", options: ["① 苦一生", "② 学会了织毛毯", "③ 学会了抬轿子"], correct: 0 },
    { title: "《骆驼》", text: "骆驼走沙漠，（  ）", options: ["① 运粮食", "② 运盐巴", "③ 不说话"], correct: 1 },
    { title: "《草儿洗澡歌》", text: "（  ）帮草儿洗澡", options: ["① 露水", "② 草儿妈妈", "③ 春风姐姐"], correct: 0 },
    { title: "《老乌鸦》", text: "小乌鸦捉到虫子给（  ）吃", options: ["① 弟弟", "② 妈妈", "③ 姐姐"], correct: 1 },
    { title: "《剪指甲》", text: "因为（  ），所以要常剪指甲", options: ["① 指甲里的细菌多", "② 手指长得胖"], correct: 0 },
    { title: "《摇钱树》", text: "儿歌中的'摇钱树'是指（  ）", options: ["① 五棵树", "② 两只手"], correct: 1 },
    { title: "《门口》", text: "读了儿歌，我懂得了（  ）", options: ["① 出门口要跑快点", "② 出门口要排队", "③ 出门口要挤一挤"], correct: 1 },
    { title: "《一群好乖乖》", text: "'一群好乖乖'是指（  ）", options: ["① 一群乖孩子", "② 一群小伙伴", "③ 一群小鸭子"], correct: 2 },
    { title: "《滑滑梯》", text: "滑滑梯的时候，上去好像（  ），下来好像（  ）。", options: ["① 坐电梯 / 爬大山", "② 爬大山 / 坐电梯"], correct: 1 },
    { title: "《小木盆》", text: "儿歌中的小朋友坐着小木盆去湖里（  ）", options: ["① 游玩", "② 摘莲蓬", "③ 摘莲花"], correct: 1 },
    { title: "《大人做事不打扰》", text: "爸爸妈妈工作忙的时候，花花给奶奶（  ）", options: ["① 捶背", "② 倒茶", "③ 浇花"], correct: 0 },
    { title: "《习惯培养歌》", text: "见到老师要（  ）", options: ["① 专心听", "② 问好", "③ 读书"], correct: 1 },
    { title: "《雪绒花》", text: "雪绒花是（  ）色的", options: ["① 雪白的", "② 淡黄的"], correct: 0 },
    { title: "《小星星》", text: "读了儿歌，你知道小星星是在（  ）在天空放光明的", options: ["① 烈日当空时", "② 朝阳出现时", "③ 夜晚"], correct: 2 },
    { title: "《划船》", text: "从儿歌中你看出划船的小朋友心情是（  ）", options: ["① 开心", "② 伤心"], correct: 0 },
    { title: "《积雪》", text: "上层的雪（  ），中层的雪（  ），下层的雪（  ）。", options: ["① 很寂寞 / 很冷 / 很累", "② 很冷 / 很寂寞 / 很累", "③ 很冷 / 很累 / 很寂寞"], correct: 1 },
    { title: "《森林里的熊先生》", text: "小姑娘在森林里弄丢了（  ）", options: ["① 头巾", "② 鞋子", "③ 贝壳耳环"], correct: 2 },
    { title: "《小红帽》", text: "小红帽要去外婆家（  ）", options: ["① 给外婆送糕点", "② 陪外婆玩"], correct: 0 },
    { title: "《我的家庭真可爱》", text: "因为我家（  ），所以说我的家庭真可爱", options: ["① 有大花园", "② 有大厅堂", "③ 家人很和气、健康"], correct: 2 },
    { title: "《公鸡》", text: "我是鸡群中（  ）。", options: ["① 最健壮的一只公鸡", "② 最可爱的一只公鸡"], correct: 0 },
    { title: "《小袋鼠》", text: "小袋鼠用（  ）当做自己的大书包。", options: ["① 皮口袋", "② 帆布袋", "③ 塑料袋"], correct: 0 },
    { title: "《我是草莓》", text: "草莓为什么说'做草莓不是总那么好玩'？（  ）", options: ["① 因为它的叶子软软的", "② 因为人们把它放进冰箱冰冻"], correct: 1 },
    { title: "《善良》", text: "要把（  ）分给大家。", options: ["① 心灵的善良", "② 爱"], correct: 0 },
    { title: "《九月》", text: "儿歌中写的是（  ）", options: ["① 夏天", "② 秋天", "③ 夏末秋初"], correct: 2 }
  ];

  // ----- 标签切换 -----
  const tabBtns = document.querySelectorAll('.tab-btn');
  const panels = {
    star: document.getElementById('starPanel'),
    apple: document.getElementById('applePanel'),
    frog: document.getElementById('frogPanel'),
    match: document.getElementById('matchPanel')
  };
  tabBtns.forEach(btn => {
    btn.addEventListener('click', function() {
      tabBtns.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      const tab = this.dataset.tab;
      Object.keys(panels).forEach(key => panels[key].classList.toggle('hidden', key !== tab));
      if (tab === 'match') renderMatch();
      if (tab === 'star') renderStarQuestion(starCurrentIdx);
      if (tab === 'apple') renderAppleQuestion(appleCurrentIdx);
      if (tab === 'frog') renderFrogQuestion(frogCurrentIdx);
    });
  });

  // ==========================================
  // 游戏1: 小星星 ⭐
  // ==========================================
  let starAnswered = new Array(27).fill(false);
  let starScore = 0;
  let starCurrentIdx = 0;
  const starScoreSpan = document.getElementById('starScore');
  const starQTitle = document.getElementById('starQTitle');
  const starQText = document.getElementById('starQText');
  const starOptions = document.getElementById('starOptions');

  function renderStarQuestion(index) {
    const q = QUESTIONS[index];
    starQTitle.textContent = q.title;
    starQText.textContent = q.text;
    starOptions.innerHTML = '';
    q.options.forEach((opt, idx) => {
      const div = document.createElement('div');
      div.className = 'opt';
      div.textContent = opt;
      div.dataset.idx = idx;
      div.addEventListener('click', () => handleStarClick(index, idx));
      starOptions.appendChild(div);
    });
    if (starAnswered[index]) {
      document.querySelectorAll('#starOptions .opt').forEach(el => el.classList.add('disabled'));
    }
    starScoreSpan.textContent = starScore;
    // 自动跳到下一未答题
    if (starAnswered.every(v => v)) {
      document.querySelectorAll('#starOptions .opt').forEach(el => el.classList.add('disabled'));
    }
  }

  function handleStarClick(qIndex, optIdx) {
    if (starAnswered[qIndex]) return;
    const q = QUESTIONS[qIndex];
    const opts = document.querySelectorAll('#starOptions .opt');
    opts.forEach(el => el.classList.add('disabled'));
    const isCorrect = (optIdx === q.correct);
    opts.forEach((el, idx) => {
      if (idx === q.correct) el.classList.add('correct');
      else if (idx === optIdx && !isCorrect) el.classList.add('wrong');
    });
    starAnswered[qIndex] = true;
    if (isCorrect) { starScore++; starScoreSpan.textContent = starScore; }
    // 自动跳到下一题
    let next = -1;
    for (let i = 0; i < 27; i++) {
      if (!starAnswered[i]) { next = i; break; }
    }
    if (next !== -1) {
      starCurrentIdx = next;
      setTimeout(() => renderStarQuestion(next), 500);
    } else {
      starScoreSpan.textContent = starScore + ' 🎉 全部完成！';
    }
  }

  document.getElementById('starResetBtn').addEventListener('click', function() {
    starAnswered = new Array(27).fill(false);
    starScore = 0;
    starCurrentIdx = 0;
    starScoreSpan.textContent = '0';
    renderStarQuestion(0);
  });

  // ==========================================
  // 游戏2: 摘苹果 🍎 (三组)
  // ==========================================
  let appleGroup = 0; // 0,1,2
  let appleScores = [0,0,0];
  let appleAnswered = new Array(27).fill(false);
  let appleCurrentIdx = 0;

  const appleQTitle = document.getElementById('appleQTitle');
  const appleQText = document.getElementById('appleQText');
  const appleOptions = document.getElementById('appleOptions');
  const appleStatus = document.getElementById('appleStatus');

  function renderAppleQuestion(index) {
    const q = QUESTIONS[index];
    appleQTitle.textContent = q.title;
    appleQText.textContent = q.text;
    appleOptions.innerHTML = '';
    q.options.forEach((opt, idx) => {
      const div = document.createElement('div');
      div.className = 'opt';
      div.textContent = opt;
      div.dataset.idx = idx;
      div.addEventListener('click', () => handleAppleClick(index, idx));
      appleOptions.appendChild(div);
    });
    if (appleAnswered[index]) {
      document.querySelectorAll('#appleOptions .opt').forEach(el => el.classList.add('disabled'));
    }
    updateAppleTrees();
    // 检查是否全部完成
    if (appleAnswered.every(v => v)) {
      appleStatus.textContent = '🎉 所有苹果都摘完啦！太棒啦！';
    }
  }

  function handleAppleClick(qIndex, optIdx) {
    if (appleAnswered[qIndex]) return;
    const q = QUESTIONS[qIndex];
    const opts = document.querySelectorAll('#appleOptions .opt');
    opts.forEach(el => el.classList.add('disabled'));
    const isCorrect = (optIdx === q.correct);
    opts.forEach((el, idx) => {
      if (idx === q.correct) el.classList.add('correct');
      else if (idx === optIdx && !isCorrect) el.classList.add('wrong');
    });
    appleAnswered[qIndex] = true;
    if (isCorrect) {
      appleScores[appleGroup]++;
      appleStatus.textContent = `🍎 第 ${appleGroup+1} 组 +1 个苹果！`;
    } else {
      appleStatus.textContent = `❌ 正确答案：${q.options[q.correct]}`;
    }
    updateAppleTrees();
    // 下一题
    let next = -1;
    for (let i = 0; i < 27; i++) {
      if (!appleAnswered[i]) { next = i; break; }
    }
    if (next !== -1) {
      appleCurrentIdx = next;
      // 轮换组
      appleGroup = (appleGroup + 1) % 3;
      setTimeout(() => renderAppleQuestion(next), 500);
    } else {
      appleStatus.textContent = '🎉 所有苹果摘完啦！';
    }
  }

  function updateAppleTrees() {
    for (let g = 0; g < 3; g++) {
      const container = document.getElementById('tree' + g);
      const scoreSpan = document.getElementById('treeScore' + g);
      scoreSpan.textContent = appleScores[g];
      container.innerHTML = '';
      const count = appleScores[g];
      for (let i = 0; i < Math.min(count, 20); i++) {
        const span = document.createElement('span');
        span.textContent = '🍎';
        span.style.fontSize = '1.6rem';
        container.appendChild(span);
      }
      if (count > 20) container.appendChild(document.createTextNode('+' + (count-20)));
    }
  }

  document.getElementById('appleResetBtn').addEventListener('click', function() {
    appleScores = [0,0,0];
    appleAnswered = new Array(27).fill(false);
    appleCurrentIdx = 0;
    appleGroup = 0;
    appleStatus.textContent = '点击选项为当前组摘苹果！';
    renderAppleQuestion(0);
  });

  // ==========================================
  // 游戏3: 动物过河 🐸
  // ==========================================
  let frogAnswered = new Array(27).fill(false);
  let frogCurrentIdx = 0;
  let frogStep = 0;
  const frogIcon = document.getElementById('frogIcon');
  const riverDisplay = document.getElementById('riverDisplay');
  const frogStatus = document.getElementById('frogStatus');
  const frogQTitle = document.getElementById('frogQTitle');
  const frogQText = document.getElementById('frogQText');
  const frogOptions = document.getElementById('frogOptions');

  function renderFrogQuestion(index) {
    const q = QUESTIONS[index];
    frogQTitle.textContent = q.title;
    frogQText.textContent = q.text;
    frogOptions.innerHTML = '';
    q.options.forEach((opt, idx) => {
      const div = document.createElement('div');
      div.className = 'opt';
      div.textContent = opt;
      div.dataset.idx = idx;
      div.addEventListener('click', () => handleFrogClick(index, idx));
      frogOptions.appendChild(div);
    });
    if (frogAnswered[index]) {
      document.querySelectorAll('#frogOptions .opt').forEach(el => el.classList.add('disabled'));
    }
    updateFrog();
  }

  function handleFrogClick(qIndex, optIdx) {
    if (frogAnswered[qIndex]) return;
    const q = QUESTIONS[qIndex];
    const opts = document.querySelectorAll('#frogOptions .opt');
    opts.forEach(el => el.classList.add('disabled'));
    const isCorrect = (optIdx === q.correct);
    opts.forEach((el, idx) => {
      if (idx === q.correct) el.classList.add('correct');
      else if (idx === optIdx && !isCorrect) el.classList.add('wrong');
    });
    frogAnswered[qIndex] = true;
    if (isCorrect) {
      frogStep++;
      frogStatus.textContent = '🐸 跳！前进了一步！';
    } else {
      frogStatus.textContent = `❌ 正确答案：${q.options[q.correct]}`;
    }
    updateFrog();
    let next = -1;
    for (let i = 0; i < 27; i++) {
      if (!frogAnswered[i]) { next = i; break; }
    }
    if (next !== -1) {
      frogCurrentIdx = next;
      setTimeout(() => renderFrogQuestion(next), 500);
    } else {
      frogStatus.textContent = '🎉 青蛙过河啦！太棒啦！';
    }
  }

  function updateFrog() {
    const total = 27;
    const progress = Math.min(frogStep / total * 100, 100);
    // 显示河流
    let river = '';
    const waveCount = 12;
    const filled = Math.floor(progress / 100 * waveCount);
    for (let i = 0; i < waveCount; i++) {
      river += (i < filled) ? '🐸' : '🌊';
    }
    riverDisplay.textContent = river;
    if (frogStep >= total) {
      frogIcon.textContent = '🏆';
    } else {
      frogIcon.textContent = '🐸';
    }
  }

  document.getElementById('frogResetBtn').addEventListener('click', function() {
    frogAnswered = new Array(27).fill(false);
    frogCurrentIdx = 0;
    frogStep = 0;
    frogStatus.textContent = '🐸 出发！答对向前跳';
    renderFrogQuestion(0);
  });

  // ==========================================
  // 游戏4: 配对卡 🧩
  // ==========================================
  let matchState = new Array(27).fill(false);
  let leftSelected = null;
  let matchPairs = 0;
  const matchLeftCol = document.getElementById('matchLeftCol');
  const matchRightCol = document.getElementById('matchRightCol');
  const matchCountSpan = document.getElementById('matchCount');
  const matchMsg = document.getElementById('matchMsg');

  function renderMatch() {
    const leftItems = QUESTIONS.map((q, i) => ({ idx: i, label: q.title + ' ' + q.text }));
    const rightItems = QUESTIONS.map((q, i) => ({ idx: i, label: q.options[q.correct] }));
    shuffleArray(leftItems);
    shuffleArray(rightItems);

    matchLeftCol.innerHTML = '<h3>📖 题目（点击选择）</h3>';
    matchRightCol.innerHTML = '<h3>✅ 正确答案（点击配对）</h3>';

    leftItems.forEach(item => {
      const div = document.createElement('div');
      div.className = 'match-item';
      if (matchState[item.idx]) div.classList.add('matched');
      div.textContent = item.label;
      div.dataset.idx = item.idx;
      div.dataset.side = 'left';
      div.addEventListener('click', () => handleMatchClick('left', item.idx));
      matchLeftCol.appendChild(div);
    });

    rightItems.forEach(item => {
      const div = document.createElement('div');
      div.className = 'match-item';
      if (matchState[item.idx]) div.classList.add('matched');
      div.textContent = item.label;
      div.dataset.idx = item.idx;
      div.dataset.side = 'right';
      div.addEventListener('click', () => handleMatchClick('right', item.idx));
      matchRightCol.appendChild(div);
    });

    matchPairs = matchState.filter(v => v).length;
    matchCountSpan.textContent = matchPairs;
    if (matchPairs === 27) matchMsg.textContent = '🎉 全部配对成功！太棒啦！';
    else matchMsg.textContent = '💡 点击左侧题目，再点右侧答案';
    leftSelected = null;
  }

  function handleMatchClick(side, idx) {
    if (matchState[idx]) return;
    if (side === 'left') {
      document.querySelectorAll('#matchLeftCol .match-item').forEach(el => el.classList.remove('selected'));
      const el = document.querySelector(`#matchLeftCol .match-item[data-idx="${idx}"]`);
      if (el) el.classList.add('selected');
      leftSelected = idx;
      const q = QUESTIONS[idx];
      matchMsg.textContent = `📌 已选：${q.title} ${q.text} → 点击右侧对应答案`;
    } else if (side === 'right') {
      if (leftSelected === null) {
        matchMsg.textContent = '⚠️ 请先在左侧点击一道题目！';
        return;
      }
      const leftIdx = leftSelected;
      if (leftIdx === idx) {
        matchState[leftIdx] = true;
        matchPairs++;
        matchCountSpan.textContent = matchPairs;
        const leftEl = document.querySelector(`#matchLeftCol .match-item[data-idx="${leftIdx}"]`);
        const rightEl = document.querySelector(`#matchRightCol .match-item[data-idx="${idx}"]`);
        if (leftEl) { leftEl.classList.remove('selected'); leftEl.classList.add('matched'); }
        if (rightEl) rightEl.classList.add('matched');
        matchMsg.textContent = '✅ 配对正确！继续～';
        leftSelected = null;
        if (matchPairs === 27) matchMsg.textContent = '🎉 全部配对成功！太棒啦！';
      } else {
        const rightEl = document.querySelector(`#matchRightCol .match-item[data-idx="${idx}"]`);
        if (rightEl) {
          rightEl.classList.add('wrong-pick');
          setTimeout(() => rightEl.classList.remove('wrong-pick'), 400);
        }
        const q = QUESTIONS[leftIdx];
        matchMsg.textContent = `❌ 配对错误！ ${q.title} 的正确答案是：${q.options[q.correct]}`;
        document.querySelectorAll('#matchLeftCol .match-item').forEach(el => el.classList.remove('selected'));
        leftSelected = null;
      }
    }
  }

  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  document.getElementById('matchResetBtn').addEventListener('click', function() {
    matchState = new Array(27).fill(false);
    leftSelected = null;
    matchPairs = 0;
    renderMatch();
  });

  // ==========================================
  // 初始化
  // ==========================================
  renderStarQuestion(0);
  renderAppleQuestion(0);
  renderFrogQuestion(0);
  renderMatch();
</script>
</body>
</html>
